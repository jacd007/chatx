name: chatx
description: >-
  Zero-dependency chat UI for Flutter: replies, reactions, media, voice
  notes, polls, surveys, threads, mentions, search, bots and markdown.
version: 0.1.0
repository: https://github.com/jacd007/chatx
issue_tracker: https://github.com/jacd007/chatx/issues
documentation: https://github.com/jacd007/chatx#readme
screenshots:
  - description: Conversation with replies, reactions and unread separator.
    path: doc/screenshots/01_conversation.png
  - description: Popup menu with quick reactions.
    path: doc/screenshots/02_popup_menu.png
  - description: Image grid, voice note and files.
    path: doc/screenshots/08_images_voice.png
  - description: Survey card, read receipts and forwarded message.
    path: doc/screenshots/16_survey_seen_forward.png
  - description: Step-by-step survey with an NPS question.
    path: doc/screenshots/17_survey_nps.png
  - description: Poll, countdown announcement and pinned message.
    path: doc/screenshots/11_poll_countdown_pinned.png
  - description: Bot buttons and quick replies.
    path: doc/screenshots/18_bot_buttons.png
  - description: Thread view.
    path: doc/screenshots/19_thread.png
  - description: Built-in emoji picker.
    path: doc/screenshots/21_emoji_picker.png
  - description: Dark mode with a custom theme.
    path: doc/screenshots/06_dark_custom_look.png
topics:
  - chat
  - messaging
  - ui
  - widget
  - markdown

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
