name: chatx
description: >-
  Zero-dependency chat UI for Flutter: replies, reactions, media, voice,
  polls, surveys, threads, AI controls, location, events and moderation.
version: 0.2.0
repository: https://github.com/jacd007/chatx
issue_tracker: https://github.com/jacd007/chatx/issues
documentation: https://github.com/jacd007/chatx#readme
screenshots:
  - description: Conversation with replies, reactions and unread separator.
    path: doc/screenshots/01_conversation.png
  - description: Popup menu with quick reactions.
    path: doc/screenshots/02_popup_menu.png
  - description: AI answer reasoning while it thinks.
    path: doc/screenshots/35_ai_reasoning.png
  - description: Survey card, read receipts and forwarded message.
    path: doc/screenshots/16_survey_seen_forward.png
  - description: AI answer with highlighted code, a table and rating.
    path: doc/screenshots/23_ai_code_table.png
  - description: Poll, countdown announcement and pinned message.
    path: doc/screenshots/11_poll_countdown_pinned.png
  - description: Team chat with roles and unread mentions.
    path: doc/screenshots/41_workspace_mentions.png
  - description: Location, contact card and sticker.
    path: doc/screenshots/26_location_contact_sticker.png
  - description: Product carousel in a shop bot.
    path: doc/screenshots/47_products.png
  - description: Dark mode with a custom theme.
    path: doc/screenshots/06_dark_custom_look.png
topics:
  - chat
  - messaging
  - ui
  - widget
  - markdown

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
