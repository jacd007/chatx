name: chatx
description: >-
  Zero-dependency, backend-agnostic chat UI for Flutter: replies, reactions,
  media, voice notes, polls, mentions, search, markdown and streaming.
version: 0.1.0
repository: https://github.com/jacd007/chatx
issue_tracker: https://github.com/jacd007/chatx/issues
documentation: https://github.com/jacd007/chatx#readme
screenshots:
  - description: Conversation with replies, reactions and unread separator.
    path: doc/screenshots/01_conversation.png
  - description: Popup menu with quick reactions.
    path: doc/screenshots/02_popup_menu.png
  - description: Swipe to reply.
    path: doc/screenshots/03_reply.png
  - description: Image grid, voice note and files.
    path: doc/screenshots/08_images_voice.png
  - description: Link preview and spoilers.
    path: doc/screenshots/07_files_links_spoilers.png
  - description: Poll, countdown announcement and pinned message.
    path: doc/screenshots/11_poll_countdown_pinned.png
  - description: Mention suggestions.
    path: doc/screenshots/12_mentions.png
  - description: Search with highlighted results.
    path: doc/screenshots/13_search.png
  - description: Bubble tails, radius and shadow.
    path: doc/screenshots/05_bubble_styles.png
  - description: Dark mode with a custom theme.
    path: doc/screenshots/06_dark_custom_look.png
topics:
  - chat
  - messaging
  - ui
  - widget
  - markdown

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter
