# Deploys the example app to GitHub Pages: https://jacd007.github.io/chatx/
name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        working-directory: example
        run: flutter build web --release --base-href /chatx/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
      - id: deployment
        uses: actions/deploy-pages@v5
